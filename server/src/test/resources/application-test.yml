spring:
  datasource:
    url: jdbc:h2:mem:usb_relay_cloud;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  jackson:
    time-zone: UTC

usb-relay:
  presence:
    offline-after: 90s
    scan-interval: 30s
  jwt:
    secret: test-jwt-secret-at-least-32-characters-long-do-not-use-in-prod
    expiration: 1h
  bootstrap:
    admin:
      username: test-admin
      password: test-pass-123
  cors:
    allowed-origins: "*"

logging:
  level:
    com.absolutezero.usbrelaycloud: WARN
