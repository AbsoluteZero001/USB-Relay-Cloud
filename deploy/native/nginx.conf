# USB Relay Cloud - Native Nginx 反向代理配置
#
# 安装步骤：
#   sudo cp deploy/native/nginx.conf /etc/nginx/sites-available/usb-relay-cloud
#   sudo ln -s /etc/nginx/sites-available/usb-relay-cloud \
#              /etc/nginx/sites-enabled/usb-relay-cloud
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# 拓扑：
#   Internet -> :80 (或 :443 + TLS) -> Nginx
#     -> /api/ proxy_pass http://127.0.0.1:8080
#     -> /ws/  proxy_pass http://127.0.0.1:8080 (WebSocket Upgrade)
#     -> /     -> /var/www/usb-relay-cloud (Vue dist)
#
# SpringBoot 8080 仅监听 127.0.0.1，MySQL 3306 仅监听 127.0.0.1，
# 都不暴露公网。对外只开放 Nginx 监听的 80 / 443。

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    # listen 443 ssl http2;   # 启用 TLS 时取消注释并配置证书
    # ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;
    server_name relay.example.com;

    # Vue 构建产物（client/dist）
    root /var/www/usb-relay-cloud;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml text/xml application/xml+rss image/svg+xml;

    # Vue Router history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> Spring Boot 8080
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # WebSocket -> Spring Boot 8080
    location /ws/ {
        proxy_pass http://127.0.0.1:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 静态资源缓存
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
